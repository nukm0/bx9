<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#17181d"><title>NEON MARKET</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>
:root{color-scheme:dark;--bg:#15161b;--panel:#202129;--line:#3b3d4b;--text:#f1f1f7;--muted:#a4a6b5;--neon:#b34dff;--cyan:#4de7ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 5% 0,#64277b25,transparent 36%),var(--bg);color:var(--text);font:15px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;color:inherit}.app{max-width:1400px;margin:auto;padding:12px}.top,.side,.panel,.item{background:#1d1e25;border:1px solid var(--line);border-radius:16px}.top{position:sticky;top:7px;z-index:10;display:flex;align-items:center;justify-content:space-between;padding:11px;gap:10px}.brand{font-weight:900;letter-spacing:.08em}.brand b{color:var(--neon);text-shadow:0 0 16px #b34dff88}.btn,.icon,.field{border:1px solid #444657;border-radius:12px;background:#202129;color:var(--text);padding:11px 13px}.btn:hover,.icon:hover{border-color:var(--neon);box-shadow:0 0 14px #b34dff22}.primary{background:linear-gradient(120deg,#7627a5,#4030a0);border-color:#a94aff}.field{width:100%;min-width:0;background:#17181f;outline:none;box-shadow:inset 0 2px 5px #0003}.field:focus{border-color:var(--neon);box-shadow:0 0 0 3px #b34dff22}.field::placeholder{color:#777b8d}.layout{display:grid;grid-template-columns:230px minmax(0,1fr);gap:16px;margin-top:16px}.side{padding:9px;align-self:start;position:sticky;top:80px}.nav{display:block;width:100%;text-align:left;padding:11px;border:1px solid transparent;background:transparent;border-radius:11px;color:var(--muted);margin:2px 0}.nav.active{color:white;border-color:var(--neon);background:#8d39ba24;box-shadow:inset 3px 0 var(--neon),0 0 12px #b34dff18}.nav:hover{border-color:#56586a;color:white}.label{font-size:11px;letter-spacing:.12em;color:#777b90;padding:14px 10px 4px}.head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:8px 0 16px}.head h1{margin:0;font-size:clamp(24px,3vw,34px)}.muted{color:var(--muted)}.filters{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:9px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.panel{overflow:hidden}.cover{height:145px;background:linear-gradient(135deg,#292b37,#1a1b23);display:grid;place-items:center;font-size:42px;color:#777b90}.cover img{width:100%;height:100%;object-fit:cover}.body{padding:12px}.meta{font-size:12px;color:var(--muted)}.price{font-size:19px;color:#d8a6ff;font-weight:850}.item{padding:13px;margin:8px 0}.tabs{display:flex;gap:7px;overflow:auto;margin-bottom:12px}.tab{white-space:nowrap;background:#1a1b22;color:var(--muted);border:1px solid var(--line);border-radius:10px;padding:9px 12px}.tab.active{border-color:var(--neon);color:white;background:#8d39ba2b}.empty{padding:28px;text-align:center;border:1px dashed #4b4d5e;border-radius:14px;color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{padding:13px;background:#202129;border:1px solid var(--line);border-radius:13px}.stat strong{display:block;font-size:23px}.modalback{position:fixed;inset:0;background:#07080dcc;z-index:50;display:grid;place-items:center;padding:14px}.modal{width:min(600px,100%);max-height:85vh;overflow:auto;background:#1c1d25;border:1px solid #8e48bb;border-radius:18px;padding:18px}.mobile{display:none}.lock{min-height:100vh;display:grid;place-items:center;padding:20px}.lockcard{max-width:480px;text-align:center;padding:28px;background:#1c1d25;border:1px solid #8e48bb;border-radius:22px}.lockcard p{color:#b2b4c2;line-height:1.6}
@media(max-width:900px){.layout{grid-template-columns:1fr}.side{position:fixed;z-index:40;top:65px;left:10px;right:10px;max-height:calc(100vh - 80px);overflow:auto;box-shadow:0 20px 70px #000b}.side.closed{display:none}.mobile{display:inline-block}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.filters{grid-template-columns:1fr 1fr}.search{grid-column:1/-1}}@media(max-width:520px){.grid{gap:8px}.cover{height:105px}.body{padding:9px}.filters{gap:6px}.stats{grid-template-columns:1fr 1fr}.head h1{font-size:25px}}
</style></head><body><div id="root"></div><div id="modal"></div><script>
(()=>{const $=s=>document.querySelector(s),$$=s=>Array.from(document.querySelectorAll(s)),tg=window.Telegram?.WebApp;let user=null,view='market',tab='overview',mobile=false,search='',category='all',sort='new';const cats={electronics:'Электроника',fashion:'Одежда и стиль',home:'Дом и интерьер',services:'Услуги',hobby:'Хобби',other:'Другое'};let data;try{data={products:[],shops:[],banners:[],notifications:[],reports:[],users:[],logs:[],favorites:[],...JSON.parse(localStorage.getItem('neon-market-data')||'{}')}}catch{data={products:[],shops:[],banners:[],notifications:[],reports:[],users:[],logs:[],favorites:[]}}const save=()=>localStorage.setItem('neon-market-data',JSON.stringify(data)),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=n=>new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR'}).format(+n||0),when=n=>new Date(n).toLocaleString('ru-RU'),admin=()=>!!user?.isAdmin;
function gate(msg='Откройте приложение внутри Telegram Mini App'){$('#root').innerHTML=`<div class="lock"><div class="lockcard"><div class="brand">NEON <b style="color:var(--neon)">MARKET</b></div><h1>🔒 ${esc(msg)}</h1><p>В обычном браузере функции закрыты. Для входа нужна серверная проверка Telegram initData.</p><p class="muted">Настройте HTTPS URL Mini App через BotFather.</p></div></div>`}
async function auth(){if(!tg?.initData)return gate();try{let r=await fetch('/api/auth/telegram',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({initData:tg.initData})});if(!r.ok)throw Error();user=(await r.json()).user;tg.ready();tg.expand();tg.setHeaderColor?.('#17181d');tg.setBackgroundColor?.('#15161b');render()}catch{gate('Сервер авторизации недоступен')}}
function nav(k,t){return `<button class="nav ${view===k?'active':''}" data-view="${k}">${t}</button>`}
function product(p){return `<article class="panel"><div class="cover">${p.image?`<img src="${esc(p.image)}">`:'▧'}</div><div class="body"><div class="meta">${esc(cats[p.category]||'Другое')} · ${when(p.created)}</div><b>${esc(p.title)}</b><p class="price">${money(p.price)}</p><p class="muted">@${esc(p.seller)}</p><button class="btn" data-detail="${p.id}">Подробнее</button> <button class="icon" data-fav="${p.id}">${data.favorites.includes(p.id)?'♥':'♡'}</button></div></article>`}
function render(){if(!user)return gate();let unread=data.notifications.filter(n=>(!n.user||n.user===user.username)&&!n.read).length;let content='';
if(view==='market'){let ps=data.products.filter(p=>p.status!=='hidden'&&p.status!=='blocked'&&(!search||`${p.title} ${p.description}`.toLowerCase().includes(search.toLowerCase()))&&(category==='all'||p.category===category));ps.sort((a,b)=>sort==='up'?a.price-b.price:sort==='down'?b.price-a.price:b.created-a.created);content=`<div class="head"><h1>Маркетплейс</h1><button class="btn primary" id="create">＋ Объявление</button></div><div class="filters"><input class="field search" id="search" placeholder="⌕ Поиск" value="${esc(search)}"><select class="field" id="category"><option value="all">Все категории</option>${Object.entries(cats).map(([k,v])=>`<option value="${k}" ${category===k?'selected':''}>${v}</option>`).join('')}</select><select class="field" id="sort"><option value="new">Сначала новые</option><option value="up" ${sort==='up'?'selected':''}>Дешевле</option><option value="down" ${sort==='down'?'selected':''}>Дороже</option></select><button class="btn" id="reset">Сбросить</button></div><p class="muted">Найдено: ${ps.length}</p>${ps.length?`<div class="grid">${ps.map(product).join('')}</div>`:'<div class="empty">Объявлений нет. Добавьте первое объявление.</div>'}`}
else if(view==='favorites'){let ps=data.products.filter(p=>data.favorites.includes(p.id));content=`<div class="head"><h1>Избранное</h1></div>${ps.length?`<div class="grid">${ps.map(product).join('')}</div>`:'<div class="empty">Сохранённых объявлений нет.</div>'}`}
else if(view==='myads'){let ps=data.products.filter(p=>p.seller===user.username);content=`<div class="head"><h1>Мои объявления</h1><button class="btn primary" id="create">＋ Добавить</button></div>${ps.map(p=>`<div class="item"><b>${esc(p.title)}</b> · ${money(p.price)}<p>${esc(p.description)}</p><button class="btn" data-delete="${p.id}">Удалить</button></div>`).join('')||'<div class="empty">У вас пока нет объявлений.</div>'}`}
else if(view==='notifications'){let ns=data.notifications.filter(n=>!n.user||n.user===user.username);content=`<div class="head"><h1>Уведомления</h1><button class="btn" id="readall">Прочитать все</button></div>${ns.map(n=>`<button class="item" style="display:block;width:100%;text-align:left" data-notice="${n.id}"><b>${esc(n.title)}</b> · ${n.read?'Прочитано':'Новое'}<p>${esc((n.body||'').slice(0,120))}</p><small class="muted">${when(n.created)}</small></button>`).join('')||'<div class="empty">Уведомлений нет.</div>'}`}
else if(view==='profile')content=`<div class="head"><h1>Профиль</h1></div><div class="panel"><h2>${esc([user.firstName,user.lastName].filter(Boolean).join(' ')||user.username)}</h2><p>@${esc(user.username)}</p><p class="muted">Telegram ID: ${esc(user.id)}</p><span class="badge">${admin()?'👑 Администратор':'Telegram'}</span></div>`;
else if(view==='shops')content=`<div class="head"><h1>Магазины</h1></div>${data.shops.map(s=>`<div class="item"><b>${esc(s.emoji||'🏪')} ${esc(s.name)}</b><p>@${esc(s.owner)} · ${esc(s.description)}</p><button class="btn" data-shop="${esc(s.owner)}">Витрина</button></div>`).join('')||'<div class="empty">Магазинов пока нет.</div>'}`;
else if(view==='faq')content=`<div class="head"><h1>FAQ</h1></div><div class="item">1. Разместить объявление — нажмите «Объявление» и заполните форму.</div><div class="item">2. Жалоба — откройте объявление и выберите «Пожаловаться».</div><div class="item">3. Telegram-вход — initData проверяется сервером.</div>`;
else if(view==='admin')content=adminView();
$('#root').innerHTML=`<div class="app"><header class="top"><div class="row"><button class="icon mobile" id="mobile">☰</button><div class="brand">NEON <b>MARKET</b></div></div><div class="row"><button class="icon" id="bell">♧${unread?'•':''}</button><button class="btn primary" id="createTop">＋ Объявление</button></div></header><div class="layout"><aside class="side ${mobile?'':'closed'}" id="side"><div class="label">МАРКЕТПЛЕЙС</div>${nav('market','⌂ Главная')}${nav('shops','▦ Магазины')}${nav('favorites','♡ Избранное')}${nav('myads','▤ Мои объявления')}${nav('notifications','♧ Уведомления '+(unread||''))}${nav('profile','◉ Профиль')}<div class="label">ИНФОРМАЦИЯ</div>${nav('faq','? FAQ')}${admin()?`<div class="label">УПРАВЛЕНИЕ</div>${nav('admin','⚙ Админ-панель')}`:''}</aside><main>${content}</main></div></div>`;
$('#mobile').onclick=()=>{mobile=!mobile;$('#side').classList.toggle('closed',!mobile)};$('#bell').onclick=()=>{data.notifications.forEach(n=>{if(!n.user||n.user===user.username)n.read=true});save();view='notifications';render()};$('#createTop')?.addEventListener('click',createForm);$$('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;mobile=false;render()});$('#create')?.addEventListener('click',createForm);
$('#search')?.addEventListener('input',e=>{search=e.target.value;let pos=e.target.selectionStart;render();$('#search')?.focus();$('#search')?.setSelectionRange(pos,pos)});$('#category')?.addEventListener('change',e=>{category=e.target.value;render()});$('#sort')?.addEventListener('change',e=>{sort=e.target.value;render()});$('#reset')?.addEventListener('click',()=>{search='';category='all';sort='new';render()});
$$('[data-fav]').forEach(b=>b.onclick=()=>{let i=data.favorites.indexOf(b.dataset.fav);i>=0?data.favorites.splice(i,1):data.favorites.push(b.dataset.fav);save();render()});
$$('[data-detail]').forEach(b=>b.onclick=()=>{let p=data.products.find(x=>x.id===b.dataset.detail);showModal(p.title,`<p class="price">${money(p.price)}</p><p>${esc(p.description)}</p><p class="muted">@${esc(p.seller)}</p><button class="btn" id="report">Пожаловаться</button>`);$('#report').onclick=()=>reportForm(p.id)});
$$('[data-delete]').forEach(b=>b.onclick=()=>{if(confirm('Удалить объявление?')){data.products=data.products.filter(p=>p.id!==b.dataset.delete);save();render()}});
$$('[data-notice]').forEach(b=>b.onclick=()=>{let n=data.notifications.find(x=>x.id===b.dataset.notice);n.read=true;save();render();showModal(n.title,`<p>${esc(n.body)}</p><p class="muted">${when(n.created)}</p>`)});
$('#readall')?.addEventListener('click',()=>{data.notifications.forEach(n=>{if(!n.user||n.user===user.username)n.read=true});save();render()});
$$('[data-shop]').forEach(b=>b.onclick=()=>{let ps=data.products.filter(p=>p.seller===b.dataset.shop);showModal('Витрина',ps.map(p=>`<div class="item">${esc(p.title)} · ${money(p.price)}</div>`).join('')||'Объявлений нет')});
$$('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});
}
function showModal(title,body,button='Закрыть'){$('#modal').innerHTML=`<div class="modalback" id="back"><section class="modal"><div class="row"><h2>${esc(title)}</h2><span style="flex:1"></span><button class="icon" data-close>✕</button></div>${body}<p><button class="btn" data-close>${button}</button></p></section></div>`;$('#back').onclick=e=>{if(e.target.id==='back'||e.target.closest('[data-close]'))$('#modal').innerHTML=''}}
function createForm(){showModal('Новое объявление',`<form id="form">${fld('Название','title','Что продаёте?')}${fld('Цена (€)','price','0','number')}<label>Категория<select class="field" name="category">${Object.entries(cats).map(([k,v])=>`<option value="${k}">${v}</option>`)}</select></label>${fld('Описание','description','Описание товара')}${fld('Ссылка на изображение','image','https://…')}</form><button class="btn primary" id="savep">Опубликовать</button>`);$('#savep').onclick=()=>{let f=Object.fromEntries(new FormData($('#form')).entries());if(!f.title?.trim()||!f.description?.trim()||Number(f.price)<0||f.price==='')return alert('Заполните название, цену и описание');data.products.unshift({id:crypto.randomUUID(),...f,price:Number(f.price),seller:user.username,created:Date.now(),status:'published'});save();$('#modal').innerHTML='';render()}}
function fld(l,n,p,t='text'){return `<label style="display:block;margin:9px 0">${l}<input class="field" name="${n}" placeholder="${p}" type="${t}" style="display:block;margin-top:4px"></label>`}
function reportForm(id){showModal('Жалоба',`<form id="rf">${fld('Причина','reason','Мошенничество')}${fld('Описание','description','Опишите проблему')}</form><button class="btn primary" id="sendr">Отправить</button>`);$('#sendr').onclick=()=>{let f=Object.fromEntries(new FormData($('#rf')).entries());if(!f.description?.trim())return alert('Описание обязательно');data.reports.unshift({id:crypto.randomUUID(),productId:id,by:user.username,reason:f.reason,description:f.description,status:'new',created:Date.now()});save();$('#modal').innerHTML=''}}
function adminView(){let tabs=[['overview','Обзор'],['products','Объявления'],['reports','Жалобы'],['users','Участники'],['banners','Баннеры'],['shops','Магазины'],['notifications','Уведомления'],['logs','Логи']];let d=data,body='';
if(tab==='overview')body=`<div class="stats">${[['Объявления',d.products.length],['Жалобы',d.reports.length],['Участники',d.users.length],['Баннеры',d.banners.length]].map(x=>`<div class="stat">${x[0]}<strong>${x[1]}</strong></div>`).join('')}</div><p class="muted">Статистика отражает только доступные данные хранилища.</p>`;
if(tab==='products')body=d.products.map(p=>`<details class="item"><summary>${esc(p.title)} · ${money(p.price)}</summary><p>${esc(p.description)}</p><p>@${esc(p.seller)}</p></details>`).join('')||'<div class="empty">Нет объявлений.</div>';
if(tab==='reports')body=d.reports.map(r=>`<details class="item"><summary>Жалоба от @${esc(r.by)} · ${esc(r.reason)}</summary><p>${esc(r.description)}</p><textarea class="field" id="comment-${r.id}" placeholder="Комментарий модератора (обязательно)"></textarea><textarea class="field" id="decision-${r.id}" placeholder="Решение владельца (обязательно)"></textarea><button class="btn" data-review="${r.id}">Сохранить решение</button></details>`).join('')||'<div class="empty">Жалоб нет.</div>';
if(tab==='users')body=`<button class="btn" id="adduser">＋ Добавить участника</button>`+d.users.map(u=>`<div class="item"><b class="${u.banned?'danger':''}">@${esc(u.username)}</b> · ID ${esc(u.id)} · ${u.banned?'Заблокирован':'Активен'}<p>${esc(u.reason||'')}</p><button class="btn" data-user="${u.id}">${u.banned?'Разблокировать':'Заблокировать'}</button></div>`).join('')||'<div class="empty">Список пользователей пока пуст.</div>';
if(tab==='banners')body=`<button class="btn primary" id="addbanner">＋ Создать баннер</button>`+d.banners.map(b=>`<div class="item">${esc(b.title)} · ${esc(b.url)} <button class="btn" data-delbanner="${b.id}">Удалить</button></div>`).join('')||'<div class="empty">Баннеров нет.</div>';
if(tab==='shops')body=d.shops.map(s=>`<div class="item">${esc(s.emoji||'🏪')} ${esc(s.name)} · @${esc(s.owner)}</div>`).join('')||'<div class="empty">Магазинов нет.</div>';
if(tab==='notifications')body=`${fld('Заголовок','ntitle','Уведомление')}${fld('Сообщение','nbody','Текст сообщения')}<button class="btn primary" id="sendn">Сохранить уведомление</button><p class="muted">Локальное уведомление не рассылается другим пользователям. Для реальной рассылки требуется сервер и Telegram Bot API.</p>`;
if(tab==='logs')body=d.logs.map(l=>`<details class="item"><summary>${esc(l.action)} · ${esc(l.actor)} · ${when(l.at)}</summary>${esc(l.detail||'')}</details>`).join('')||'<div class="empty">Записей нет.</div>';
return `<div class="head"><h1>Админ-панель</h1></div><div class="tabs">${tabs.map(([k,v])=>`<button class="tab ${tab===k?'active':''}" data-tab="${k}">${v}</button>`).join('')}</div>${body}`}
document.addEventListener('click',e=>{let b=e.target.closest('[data-review]');if(b){let r=data.reports.find(x=>x.id===b.dataset.review),c=$('#comment-'+r.id).value.trim(),d=$('#decision-'+r.id).value.trim();if(!c||!d)return alert('Комментарий и решение обязательны');Object.assign(r,{moderatorComment:c,ownerDecision:d,status:'reviewed'});data.logs.unshift({action:'Рассмотрена жалоба',actor:user.username,detail:r.id,at:Date.now()});save();render()}});
document.addEventListener('click',e=>{let b=e.target.closest('[data-user]');if(b){let u=data.users.find(x=>x.id===b.dataset.user);if(u.banned){u.banned=false;u.reason=''}else{let r=prompt('Причина блокировки');if(!r)return;u.banned=true;u.reason=r}data.logs.unshift({action:u.banned?'Блокировка':'Разблокировка',actor:user.username,detail:u.username,at:Date.now()});save();render()}});
document.addEventListener('click',e=>{let b=e.target.closest('[data-delbanner]');if(b){data.banners=data.banners.filter(x=>x.id!==b.dataset.delbanner);save();render()}});
document.addEventListener('click',e=>{if(e.target.id==='addbanner'){showModal('Новый баннер',`${fld('Заголовок','title','Акция')}${fld('URL','url','https://…')}${fld('Изображение','image','https://…')}`);let m=$('#modal .modal');m.insertAdjacentHTML('beforeend','<button class="btn primary" id="savebanner">Сохранить</button>');$('#savebanner').onclick=()=>{let f=Object.fromEntries(new FormData(m).entries());if(!f.title||!f.url)return alert('Заполните заголовок и URL');data.banners.push({id:crypto.randomUUID(),...f,placement:'both'});save();$('#modal').innerHTML='';render()}}if(e.target.id==='adduser'){showModal('Новый участник',`${fld('Username','username','username')}${fld('Telegram ID','id','123456')}`);let m=$('#modal .modal');m.insertAdjacentHTML('beforeend','<button class="btn primary" id="saveuser">Добавить</button>');$('#saveuser').onclick=()=>{let f=Object.fromEntries(new FormData(m).entries());if(!f.username||!f.id)return alert('Заполните поля');data.users.push({...f,banned:false});save();$('#modal').innerHTML='';render()}}if(e.target.id==='sendn'){let title=$('[name=ntitle]').value.trim(),body=$('[name=nbody]').value.trim();if(!title||!body)return alert('Заполните поля');data.notifications.unshift({id:crypto.randomUUID(),title,body,created:Date.now(),read:false});data.logs.unshift({action:'Создано уведомление',actor:user.username,detail:title,at:Date.now()});save();render()}});
auth();
})();
</script></body></html>
